services:
  postgres:
    image: postgres:18-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tan-servora
    volumes:
      # PG 18+ stores data under a major-version subdir of /var/lib/postgresql
      # (see docker-library/postgres#1259). Mount the parent dir, not /data.
      - pg_data:/var/lib/postgresql

volumes:
  pg_data:
